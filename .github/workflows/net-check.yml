name: Check the packs address from a runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Ask promptpetal.com for the packs list
        shell: pwsh
        run: |
          try {
            $r = Invoke-WebRequest -Uri "https://promptpetal.com/api/packs" -Headers @{ Accept = "application/json" } -UseBasicParsing
            Write-Host "status $($r.StatusCode), $($r.Content.Length) bytes"
            $r.Headers.GetEnumerator() | ForEach-Object { Write-Host "  $($_.Key): $($_.Value)" }
          } catch {
            Write-Host "failed: $($_.Exception.Message)"
            if ($_.Exception.Response) { Write-Host "status $([int]$_.Exception.Response.StatusCode)" }
            exit 1
          }
